<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        button { display: block; width: 80%; max-width: 300px; margin: 20px auto; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .btn-ligar { background-color: #00ff66; color: black; }
        .btn-desligar { background-color: #ff3333; color: white; }
    </style>
</head>
<body>

    <h2>PAINEL AIM ASSIST</h2>
    <p>Clique para enviar o comando para o celular</p>

    <button class="btn-ligar" onclick="enviar('true')">Ligar Script</button>
    <button class="btn-desligar" onclick="enviar('false')">Desligar Script</button>

    <script>
        // Esse link precisa ser IGUAL ao do seu script Lua
        const URL_API = "https://kvdb.io/MN867t76GytGvYt7Gf7f/meu_script_secreto";

        function enviar(status) {
            fetch(URL_API, { method: 'POST', body: status })
            .then(() => alert("Comando enviado: " + (status === 'true' ? 'LIGAR' : 'DESLIGAR')))
            .catch(err => alert("Erro ao enviar: " + err));
        }
    </script>
</body>
</html>
